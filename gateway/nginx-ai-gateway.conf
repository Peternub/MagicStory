limit_req_zone $binary_remote_addr zone=ai_gateway:10m rate=20r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 72.56.73.155;

    ssl_certificate /etc/skazkids-ai-gateway/tls/gateway.crt;
    ssl_certificate_key /etc/skazkids-ai-gateway/tls/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;

    allow 201.34.140.220;
    deny all;

    client_max_body_size 160k;

    location / {
        limit_req zone=ai_gateway burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 100s;
        proxy_hide_header X-Powered-By;
    }
}
